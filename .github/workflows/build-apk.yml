name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack game project
        run: |
          unzip -q SkyIslandAdventure3D_project.zip
          mkdir -p SkyIslandAdventure3D/build

      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p tpl ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Android SDK and signing key
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          keytool -genkeypair -keystore "$HOME/game.keystore" -storepass android -alias key -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SkyIsland,O=Game,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/game.keystore"
          export/android/debug_keystore_user = "key"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Build APK
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/game.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=key
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          godot --headless --path SkyIslandAdventure3D --import || true
          godot --headless --path SkyIslandAdventure3D --export-release "Android" build/SkyIslandAdventure3D.apk
          ls -la SkyIslandAdventure3D/build

      - uses: actions/upload-artifact@v4
        with:
          name: SkyIslandAdventure3D-apk
          path: SkyIslandAdventure3D/build/SkyIslandAdventure3D.apk
